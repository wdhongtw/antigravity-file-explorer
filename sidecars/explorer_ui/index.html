<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>File Explorer</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <!-- Top Clickable Root Folder Rows -->
      <div class="root-selector-box">
        <div class="root-selector-header">
          <span class="root-selector-label">
            Root Folders
            <span id="count-roots" class="badge-count">0</span>
          </span>
        </div>
        <div id="root-list" class="root-list" role="listbox" aria-label="Associated root folders"></div>
      </div>

      <!-- Filter / Search & Root Actions Toolbar -->
      <div id="explorer-toolbar" class="explorer-toolbar hidden">
        <div class="toolbar-row">
          <input
            id="search-input"
            type="search"
            class="file-search"
            placeholder="Filter or search files in active root…"
            autocomplete="off"
          >
          <label class="dotfile-toggle" title="Show hidden dotfiles (.*)">
            <input type="checkbox" id="chk-hidden" checked>
            <span>.* Hidden</span>
          </label>
        </div>
        <div class="active-root-actions">
          <button id="btn-new-file" type="button" class="ghost-btn sm" title="Create new file in selected folder">+ File</button>
          <button id="btn-new-folder" type="button" class="ghost-btn sm" title="Create new folder in selected folder">+ Folder</button>
          <button id="btn-upload-files" type="button" class="ghost-btn sm" title="Upload files into selected folder">&#8593; Upload</button>
          <button id="btn-upload-folder" type="button" class="ghost-btn sm" title="Upload a folder into selected folder">&#8593; Folder</button>
          <input id="upload-files-input" type="file" multiple class="hidden">
          <input id="upload-folder-input" type="file" webkitdirectory directory multiple class="hidden">
          <button id="btn-collapse-all" type="button" class="ghost-btn sm collapse-all-btn" title="Collapse all expanded folders">Collapse All</button>
        </div>
      </div>
    </header>

    <main class="explorer-body">
      <div id="tree-container" class="tree-container" role="tree" aria-label="File explorer tree">
        <div class="empty-state">Loading session root folders…</div>
      </div>
    </main>

    <!-- Drag & Drop Upload Overlay (Zero Layout Shift) -->
    <div id="drop-overlay" class="drop-overlay hidden" aria-hidden="true">
      <div class="drop-card">Drop files or folders here to upload</div>
    </div>

    <!-- Floating Modal Overlay for Create / Rename / Delete (Zero Layout Shift) -->
    <div id="mutation-bar" class="mutation-overlay hidden" role="dialog" aria-modal="true" aria-label="File action prompt"></div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
