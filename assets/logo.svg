  <!-- Window Header Dots -->
  <circle cx="60" cy="62" r="3" fill="#f43f5e"/>
  <circle cx="70" cy="62" r="3" fill="#fbbf24"/>
  <circle cx="80" cy="62" r="3" fill="#34d399"/>
