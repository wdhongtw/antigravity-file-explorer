  <circle cx="29" cy="54" r="4.5" fill="#10b981"/>
  <rect x="39" y="51" width="34" height="6" rx="3" fill="#78350f" fill-opacity="0.45"/>
  <circle cx="29" cy="68" r="4.5" fill="#78350f" fill-opacity="0.35"/>
  <rect x="39" y="65" width="24" height="6" rx="3" fill="#78350f" fill-opacity="0.35"/>

  <!-- Floating AuxPane File Preview Window (Bottom-Right) -->
